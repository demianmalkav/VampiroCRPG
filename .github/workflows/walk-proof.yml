name: Walk proof
on:
  push:
    branches: ['proof/m2-walk-01']
  pull_request:
    branches: ['proof/m2-scene-01']
permissions:
  contents: read
jobs:
  build-test-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Authoring and browser QA dependencies
        run: |
          python -m pip install bpy==4.5.14 Pillow==11.3.0
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Build editable NY sources and export named clips
        run: |
          python tools/art/prepare_ny.py
          python tools/art/build_ny_source.py > art-build.log 2>&1
          python tools/art/export_ny.py assets/walk/source/ny-player.blend >> art-build.log 2>&1
          python tools/art/export_ny.py assets/walk/source/ny-contact.blend >> art-build.log 2>&1
          python tools/art/export_ny.py assets/walk/source/ny-environment.blend >> art-build.log 2>&1
      - name: Export saved-source coat material edit
        run: |
          python tools/art/variant_ny.py > art-variant.log 2>&1
          python tools/art/export_ny.py assets/walk/source/ny-player-variant.blend --out assets/walk/generated/variant >> art-variant.log 2>&1
      - name: Unit regression and spatial contracts
        run: python -m unittest discover -s tests -v > qa/walk/unit-results.txt 2>&1
      - name: Sprite coherence and actual browser walkthrough
        env:
          PYTHONPATH: .
        run: |
          python qa/walk/check_art.py
          python qa/walk/check_browser.py
      - name: Package and start extracted bundle
        run: python qa/walk/package.py
      - name: Upload playable folder
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: El-pasaje-Nueva-York-muestra-02
          path: dist/
          retention-days: 90
      - name: Preserve QA evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Walk-proof-evidence
          path: |
            qa/walk/*.png
            qa/walk/*.json
            qa/walk/unit-results.txt
            art-build.log
            art-variant.log
          retention-days: 90
